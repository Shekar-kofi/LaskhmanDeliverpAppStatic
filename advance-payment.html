<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <title>Advance Payment | Delivery Jobs</title>
</head>

<body>
  <div class="header-logo">
    <img src="logo.svg" alt="D3 Logistiks Logo">
    <p class="company-name">SMARDOCE SOLUTIONS PVT LTD</p>
  </div>

  <main class="main-card">
    <nav class="page-menu">
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Open menu">
        <img src="assets/menu.png" alt="Menu" class="menu-icon-img">
      </button>
      <div class="menu-dropdown" id="menu-dropdown" aria-hidden="true">
        <a href="referafriend.html" class="menu-bonus-link menu-item-link">
          <span class="menu-item-icon">🔖</span>
          Refer a Friend
          <span class="menu-bonus-value">1000/-</span>
        </a>
        <a href="help.html" class="menu-item-link">
          <span class="menu-item-icon">💡</span>
          Help
        </a>
        <a href="advance-payment.html" class="menu-item-link">
          <span class="menu-item-icon">💰</span>
          Advance Payment
        </a>
        <a href="complaint.html" class="menu-item-link">
          <span class="menu-item-icon">⚠️</span>
          Complaint
        </a>
      </div>
    </nav>
    <h2>Advance Payment Request</h2>
    <p style="text-align: center;">Submit your details to request advance payment.</p>

    <div class="form-control-group">
      <label for="ap-name"><strong>Full Name</strong></label>
      <input type="text" id="ap-name" name="ap-name" placeholder="Enter your full name" maxlength="30" required>
      <div id="ap-name-error" class="error-message" style="display: none;"></div>
    </div>

    <div class="form-control-group">
      <label for="ap-phone"><strong>Phone Number</strong></label>
      <input type="tel" id="ap-phone" name="ap-phone" placeholder="Enter your phone number" pattern="[0-9]{10}" maxlength="10" required>
      <div id="ap-phone-error" class="error-message" style="display: none;"></div>
    </div>

    <div class="form-control-group">
      <label for="ap-hub-name"><strong>Hub Name</strong></label>
      <input type="text" id="ap-hub-name" name="ap-hub-name" placeholder="Enter hub name" required>
    </div>

    <div class="form-control-group">
      <label for="ap-hub-incharge"><strong>Hub Incharge Name</strong></label>
      <input type="text" id="ap-hub-incharge" name="ap-hub-incharge" placeholder="Enter hub incharge name" required>
    </div>

    <div class="form-control-group">
      <label for="ap-location"><strong>Location</strong></label>
      <select id="ap-location" name="ap-location" required>
        <option value="">---Select---</option>
        <option value="alluri_sitharama_raju">Alluri Sitharama Raju</option>
        <option value="anakapalli">Anakapalli</option>
        <option value="ananthapuramu">Ananthapuramu</option>
        <option value="annamayya">Annamayya</option>
        <option value="bapatla">Bapatla</option>
        <option value="chittoor">Chittoor</option>
        <option value="dr_br_ambedkar_konaseema">Dr. B.R. Ambedkar Konaseema</option>
        <option value="east_godavari">East Godavari</option>
        <option value="eluru">Eluru</option>
        <option value="guntur">Guntur</option>
        <option value="kakinada">Kakinada</option>
        <option value="krishna">Krishna</option>
        <option value="kurnool">Kurnool</option>
        <option value="nandyal">Nandyal</option>
        <option value="ntr">NTR</option>
        <option value="prakasam">Prakasam</option>
        <option value="spsr_nellore">SPSR Nellore</option>
        <option value="srikakulam">Srikakulam</option>
        <option value="tirupati">Tirupati</option>
        <option value="visakhapatnam">Visakhapatnam</option>
        <option value="vizianagaram">Vizianagaram</option>
        <option value="west_godavari">West Godavari</option>
        <option value="ysr_kadapa">YSR Kadapa</option>
        <option value="other">Other</option>
      </select>
      <input type="text" id="ap-other-location" name="ap-other-location" placeholder="Enter other location" style="display:none; margin-top: 10px;">
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <button id="ap-submit-btn" class="whatsapp-apply-btn" type="button">
        Submit Request
      </button>
    </div>

    <p style="text-align: center; margin-top: 20px;"><a class="page-link" href="index.html">Back to Home</a></p>
  </main>

  <script src="script.js"></script>

  <div class="loading-overlay" id="loading-overlay">
    <div>
      <div class="spinner"></div>
      <div class="loading-text">Submitting...</div>
    </div>
  </div>

</body>

</html>
