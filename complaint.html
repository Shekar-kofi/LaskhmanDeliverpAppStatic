<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <title>Complaint | Delivery Jobs</title>
</head>

<body>
  <div class="header-logo">
    <img src="logo.svg" alt="D3 Logistiks Logo">
    <p class="company-name">SMARDOCE SOLUTIONS PVT LTD</p>
  </div>

  <main class="main-card">
    <nav class="page-menu">
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu-dropdown" id="menu-dropdown" aria-hidden="true">
        <a href="referafriend.html">Refer a Friend</a>
        <a href="help.html">Help</a>
        <a href="advance-payment.html">Advance Payment</a>
        <a href="complaint.html">Complaint</a>
      </div>
    </nav>
    <h2>Complaint</h2>
    <p>Submit complaints regarding service issues, payments, or app problems.</p>
    <p>We take every complaint seriously and will respond as quickly as possible.</p>
    <form id="complaint-form" class="complaint-form">
      <div class="form-control-group">
        <label for="cm-name">Name</label>
        <input id="cm-name" type="text" placeholder="Enter your name" />
      </div>
      <div class="form-control-group">
        <label for="cm-phone">Phone Number</label>
        <input id="cm-phone" type="tel" placeholder="Enter phone number" />
      </div>
      <div class="form-control-group">
        <label for="cm-hub-name">Hub Name</label>
        <input id="cm-hub-name" type="text" placeholder="Enter hub name" />
      </div>
      <div class="form-control-group">
        <label for="cm-complaint">Complaint</label>
        <textarea id="cm-complaint" rows="4" placeholder="Describe your complaint"></textarea>
      </div>
      <button type="submit" class="whatsapp-apply-btn" id="cm-submit-btn" disabled>Submit Complaint</button>
    </form>
    <p><a class="page-link" href="index.html">Back to Home</a></p>
  </main>

  <script src="script.js"></script>

  <div class="loading-overlay" id="loading-overlay">
    <div>
      <div class="spinner"></div>
      <div class="loading-text">Submitting...</div>
    </div>
  </div>

</body>

</html>
