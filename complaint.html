<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <title>File a Complaint | Delivery Jobs Support</title>
  <meta name="description" content="File a complaint or report an issue with your delivery partner job. SMARDOCE support team is here to help resolve your concerns quickly.">
  <meta name="robots" content="index, follow">
</head>

<body>
  <div class="header-logo">
    <img src="logo.svg" alt="D3 Logistiks Logo">
    <p class="company-name">SMARDOCE SOLUTIONS PVT LTD</p>
  </div>

  <main class="main-card">
    <nav class="page-menu">
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Open menu">
        <img src="assets/menu.png" alt="Menu" class="menu-icon-img">
      </button>
      <div class="menu-dropdown" id="menu-dropdown" aria-hidden="true">
        <a href="referafriend.html" class="menu-bonus-link menu-item-link">
          <span class="menu-item-icon">🔖</span>
          Refer a Friend
          <span class="menu-bonus-value">1000/-</span>
        </a>
        <a href="help.html" class="menu-item-link">
          <span class="menu-item-icon">💡</span>
          Help
        </a>
        <a href="advance-payment.html" class="menu-item-link">
          <span class="menu-item-icon">💰</span>
          Advance Payment
        </a>
        <a href="complaint.html" class="menu-item-link">
          <span class="menu-item-icon">⚠️</span>
          Complaint
        </a>
      </div>
    </nav>
    <h2>Complaint</h2>
    <p>Submit complaints regarding service issues, payments, or app problems.</p>
    <p>We take every complaint seriously and will respond as quickly as possible.</p>
    <form id="complaint-form" class="complaint-form">
      <div class="form-control-group">
        <label for="cm-name">Name</label>
        <input id="cm-name" type="text" placeholder="Enter your name" maxlength="30" />
        <div id="cm-name-error" class="error-message" style="display: none;"></div>
      </div>
      <div class="form-control-group">
        <label for="cm-phone">Phone Number</label>
        <input id="cm-phone" type="tel" placeholder="Enter phone number" pattern="[0-9]{10}" maxlength="10" />
        <div id="cm-phone-error" class="error-message" style="display: none;"></div>
      </div>
      <div class="form-control-group">
        <label for="cm-hub-name">Hub Name</label>
        <input id="cm-hub-name" type="text" placeholder="Enter hub name" />
      </div>
      <div class="form-control-group">
        <label for="cm-complaint">Complaint</label>
        <textarea id="cm-complaint" rows="4" placeholder="Describe your complaint"></textarea>
      </div>
      <button type="submit" class="whatsapp-apply-btn" id="cm-submit-btn" disabled>Submit Complaint</button>
    </form>
    <p><a class="page-link" href="index.html">Back to Home</a></p>
  </main>

  <script src="script.js"></script>

  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-container">
      <div class="delivery-bike">
        <div class="spinner-ring">
          <div class="spinner-dot"></div>
        </div>
      </div>
      <div>
        <div class="loading-text">Processing Your Application...</div>
        <div style="margin-top: 10px; font-size: 0.9em; color: rgba(255,255,255,0.8); text-align: center; letter-spacing: 1px;">
          <span style="display: inline-block; animation: dotAnimation 1.5s infinite;">.</span><span style="display: inline-block; animation: dotAnimation 1.5s 0.3s infinite;">.</span><span style="display: inline-block; animation: dotAnimation 1.5s 0.6s infinite;">.</span>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
