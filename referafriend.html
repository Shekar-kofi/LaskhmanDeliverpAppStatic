<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.svg">
  <link rel="stylesheet" href="style.css">
  <title>Refer a Friend | Earn ₹1000 Bonus | Delivery Jobs</title>
  <meta name="description" content="Refer a friend and earn ₹1000 bonus for delivery partner jobs. Share delivery job opportunities and get rewarded when your friend completes 26 days of work.">
  <meta name="robots" content="index, follow">
</head>

<body>
  <div class="header-logo">
    <img src="logo.svg" alt="D3 Logistiks Logo">
    <p class="company-name">SMARDOCE SOLUTIONS PVT LTD</p>
  </div>

  <main class="main-card">
    <nav class="page-menu">
      <button class="menu-toggle" id="menu-toggle" aria-expanded="false" aria-label="Open menu">
        <img src="assets/menu.png" alt="Menu" class="menu-icon-img">
      </button>
      <div class="menu-dropdown" id="menu-dropdown" aria-hidden="true">
        <a href="referafriend.html" class="menu-bonus-link menu-item-link">
          <span class="menu-item-icon">🔖</span>
          Refer a Friend
          <span class="menu-bonus-value">1000/-</span>
        </a>
        <a href="help.html" class="menu-item-link">
          <span class="menu-item-icon">💡</span>
          Help
        </a>
        <a href="advance-payment.html" class="menu-item-link">
          <span class="menu-item-icon">💰</span>
          Advance Payment
        </a>
        <a href="complaint.html" class="menu-item-link">
          <span class="menu-item-icon">⚠️</span>
          Complaint
        </a>
      </div>
    </nav>
    <h2>Refer a Friend</h2>
    <!-- <p>Share the opportunity with your friends who want delivery partner jobs.
      If they join through you, you can earn rewards and support them throughout the process.</p> -->
    <p><strong>Note:</strong> Referral bonus will be given only when the referral friend works at least for 26 days.</p>
    <form id="refer-friend-form" class="refer-friend-form">
      <div class="form-control-group">
        <label for="rf-name">Name</label>
        <input id="rf-name" type="text" placeholder="Enter your name" maxlength="30" />
        <div id="rf-name-error" class="error-message" style="display: none;"></div>
      </div>
      <div class="form-control-group">
        <label for="rf-phone">Phone Number</label>
        <input id="rf-phone" type="tel" placeholder="Enter phone number" pattern="[0-9]{10}" maxlength="10" />
        <div id="rf-phone-error" class="error-message" style="display: none;"></div>
      </div>
      <div class="form-control-group">
        <label for="rf-hub-name">Hub Name</label>
        <input id="rf-hub-name" type="text" placeholder="Enter hub name" />
      </div>
      <div class="form-control-group">
        <label for="rf-referral-name">Referral Name</label>
        <input id="rf-referral-name" type="text" placeholder="Enter referral name" />
      </div>
      <div class="form-control-group">
        <label for="rf-location">Location</label>
        <select id="rf-location" name="rf-location">
          <option value="">---Select---</option>
          <option value="alluri_sitharama_raju">Alluri Sitharama Raju</option>
          <option value="anakapalli">Anakapalli</option>
          <option value="ananthapuramu">Ananthapuramu</option>
          <option value="annamayya">Annamayya</option>
          <option value="bapatla">Bapatla</option>
          <option value="chittoor">Chittoor</option>
          <option value="dr_br_ambedkar_konaseema">Dr. B.R. Ambedkar Konaseema</option>
          <option value="east_godavari">East Godavari</option>
          <option value="eluru">Eluru</option>
          <option value="guntur">Guntur</option>
          <option value="kakinada">Kakinada</option>
          <option value="krishna">Krishna</option>
          <option value="kurnool">Kurnool</option>
          <option value="nandyal">Nandyal</option>
          <option value="ntr">NTR</option>
          <option value="prakasam">Prakasam</option>
          <option value="spsr_nellore">SPSR Nellore</option>
          <option value="srikakulam">Srikakulam</option>
          <option value="tirupati">Tirupati</option>
          <option value="visakhapatnam">Visakhapatnam</option>
          <option value="vizianagaram">Vizianagaram</option>
          <option value="west_godavari">West Godavari</option>
          <option value="ysr_kadapa">YSR Kadapa</option>
          <option value="other">Other</option>
        </select>
        <input id="rf-other-location" type="text" placeholder="Enter other location" style="display:none; margin-top: 10px;" />
      </div>
      <button type="submit" class="whatsapp-apply-btn" id="rf-submit-btn" disabled>Submit Referral</button>
    </form>
    <p><a class="page-link" href="index.html">Back to Home</a></p>
  </main>

  <script src="script.js"></script>

  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-container">
      <div class="delivery-bike">
        <div class="bike-body">🏍️</div>
        <div class="bike-trail"></div>
      </div>
      <div class="loading-text">Submitting...</div>
    </div>
  </div>

</body>

</html>
